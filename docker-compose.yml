services:
  itco-dashboard:
    build: .
    container_name: itco-dashboard
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - DATABASE_PATH=/app/data/dashboard.db
      - PYTHONUNBUFFERED=1
      - TZ=Europe/Moscow
      - APP_TIMEZONE=Europe/Moscow
    volumes:
      - ./data:/app/data
      - ./browser_data:/app/backend/browser_data

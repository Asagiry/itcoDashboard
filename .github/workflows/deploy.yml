name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      no_cache:
        description: 'Build without cache (--no-cache)'
        required: false
        type: boolean
        default: false

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests
        run: |
          python -m unittest discover backend/tests

  deploy:
    name: Deploy to VPS
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: SSH and Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST || vars.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME || vars.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            set -e
            echo "==> Pulling latest changes from main branch..."
            cd /opt/itcoDashboard
            git fetch origin main
            git reset --hard origin/main

            echo "==> Building Docker image..."
            if [ "${{ github.event.inputs.no_cache }}" = "true" ]; then
              docker compose build --no-cache
            else
              docker compose build
            fi

            echo "==> Starting containers..."
            docker compose up -d --force-recreate

            echo "==> Cleaning up dangling images..."
            docker image prune -f

            echo "==> Checking container status..."
            docker ps --filter name=itco-dashboard
